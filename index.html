<html>
	<head>
		<title>
	      Introduction to Javascript
		</title>
	</head>
	
	<body>
		<!-- onclick, 
			Change style.fontsize"42px" -->
		<h1 
		id="action1"
		onclick= "
		document
				.getElementById('action1')
				.style
				.fontSize='42px'
		"		>Hello Gasdam </h1>
		
		<!-- ondblclick, 
		     change innerHTML="Goodbye World" -->
		<h1 id="action2"
		ondblclick= "
		document
				.getElementById('action2')
				.innerHTML = 'Goodbye World';
		"		>Hello BOSS N.I.O </h1>
		
		<!-- onmouseover,
			Change style.color="red" -->
		<h1 id="action3" onmouseover ="
		document
				.getElementById('action3')
				.style
				.color = 'Pink'
				">Hello Doreymon </h1>
		
		<!-- onmouseout,
			change style.backgroundcolor="blue" -->
		<h1 id="action4" onmouseout ="
		document
				.getElementById('action4')
				.style
				.backgroundColor = 'Red'
				">Hello Bai </h1>
				<button onclick="alert('Pogi mo bossing ko!!!!!');">Click Here</button>
	
	
	
	
	
	
	</body>
</html>
